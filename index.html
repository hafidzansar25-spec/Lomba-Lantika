<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HustleYouth - Micro-Freelance Marketplace</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        primary: '#6366F1', // Electric Indigo
                        secondary: '#F59E0B', // Warm Amber
                        dark: '#0B0F19',
                        surface: '#1E293B',
                        light: '#F8FAFC'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-dark text-light font-sans antialiased relative">

    <!-- BACKGROUND ARTISTIC BLOBS -->
    <div class="bg-blob bg-primary w-[500px] h-[500px] top-[-150px] left-[-100px]"></div>
    <div class="bg-blob bg-secondary w-[400px] h-[400px] top-[20%] right-[-100px]" style="animation-delay: -5s;"></div>
    <div class="bg-blob bg-purple-600 w-[300px] h-[300px] bottom-[10%] left-[20%]" style="animation-delay: -10s;"></div>

    <!-- Navbar -->
    <nav class="glass-navbar sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center gap-2">
                    <i class="fa-solid fa-bolt text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary text-2xl"></i>
                    <a href="index.html" class="font-extrabold text-2xl tracking-tighter">Hustle<span class="text-primary">Youth</span><span class="text-secondary text-xl">.</span></a>
                </div>
                <div>
                    <a href="tambah-jasa.html" class="bg-primary hover:bg-indigo-500 text-white px-6 py-2.5 rounded-full font-semibold transition-all duration-300 shadow-[0_0_15px_rgba(99,102,241,0.5)] flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> Buka Jasa
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero & Search Section -->
    <header class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-16 pb-12 text-center relative z-10">
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full glass-panel text-xs font-semibold text-gray-300 mb-6">
            <span class="flex h-2 w-2 rounded-full bg-primary animate-pulse"></span>
            Platform Micro-Freelance #1 untuk Gen Z
        </div>

        <h1 class="text-4xl md:text-6xl font-extrabold mb-6 tracking-tight leading-tight">
            Temukan Jasa Kreatif <br>
            <span class="text-light scribble-underline">Talenta Muda</span> Terbaik
            <i class="fa-solid fa-sparkles text-secondary text-3xl ml-2 animate-pulse"></i>
        </h1>
        
        <p class="text-gray-400 max-w-xl mx-auto mb-10 text-lg">Pesan jasa desain, video, coding, hingga penulisan dari pelajar & mahasiswa berbakat. Harga bersahabat, kualitas juara.</p>
        
        <!-- Search Input -->
        <div class="max-w-xl mx-auto relative group">
            <div class="absolute -inset-1 bg-gradient-to-r from-primary to-secondary rounded-2xl blur opacity-20 group-hover:opacity-40 transition duration-1000 group-hover:duration-200"></div>
            <div class="relative flex items-center glass-panel rounded-xl overflow-hidden">
                <i class="fa-solid fa-search absolute left-5 text-gray-400 text-lg"></i>
                <input type="text" id="search-input" placeholder="Cari jasa (misal: Desain Logo)..." 
                    class="w-full pl-14 pr-4 py-4 focus:outline-none text-lg bg-transparent text-light placeholder-gray-500">
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-20 relative z-10">
        
        <!-- Category Filters -->
        <div id="category-filters" class="flex flex-wrap justify-center gap-3 mb-12">
            <button class="filter-btn px-6 py-2.5 rounded-full font-bold bg-primary text-white shadow-[0_0_15px_rgba(99,102,241,0.4)] transition-all transform hover:scale-105" data-category="Semua">Semua</button>
            <button class="filter-btn px-6 py-2.5 rounded-full font-bold glass-panel text-gray-300 hover:border-primary hover:text-primary transition-all transform hover:scale-105" data-category="Design">Design</button>
            <button class="filter-btn px-6 py-2.5 rounded-full font-bold glass-panel text-gray-300 hover:border-primary hover:text-primary transition-all transform hover:scale-105" data-category="Video">Video</button>
            <button class="filter-btn px-6 py-2.5 rounded-full font-bold glass-panel text-gray-300 hover:border-primary hover:text-primary transition-all transform hover:scale-105" data-category="Code">Code</button>
            <button class="filter-btn px-6 py-2.5 rounded-full font-bold glass-panel text-gray-300 hover:border-primary hover:text-primary transition-all transform hover:scale-105" data-category="Writing">Writing</button>
        </div>

        <!-- Grid Container (Diisi oleh app.js) -->
        <div id="gigs-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Konten dummy dihapus, JS akan mengisinya -->
        </div>
    </main>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="hidden fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div id="modal-content" class="glass-panel bg-[#131927] rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden transform transition-all border border-white/10">
            <div class="p-8 text-center text-gray-400">
                <p>Memuat data...</p>
            </div>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
</body>
</html>
