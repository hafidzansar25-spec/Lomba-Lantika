<body class="bg-light text-dark font-sans antialiased relative">

    <!-- ELEMEN ARTISTIK: Background Blobs -->
    <div class="bg-blob bg-indigo-300 w-[400px] h-[400px] top-[-100px] left-[-100px]"></div>
    <div class="bg-blob bg-yellow-200 w-[300px] h-[300px] top-[20%] right-[-50px]" style="animation-delay: -3s;"></div>
    <div class="bg-blob bg-purple-200 w-[350px] h-[350px] bottom-[10%] left-[10%]" style="animation-delay: -5s;"></div>

    <!-- Navbar -->
    <nav class="bg-white/80 backdrop-blur-md border-b border-gray-100 sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex-shrink-0 flex items-center gap-2">
                    <!-- Ikon Bolt diganti dengan warna gradien -->
                    <i class="fa-solid fa-bolt text-transparent bg-clip-text bg-gradient-to-r from-primary to-secondary text-2xl"></i>
                    <a href="index.html" class="font-extrabold text-2xl tracking-tighter">Hustle<span class="text-primary">Youth</span><span class="text-secondary text-xl">.</span></a>
                </div>
                <div>
                    <a href="tambah-jasa.html" class="bg-dark hover:bg-primary text-white px-6 py-2.5 rounded-full font-semibold transition-all duration-300 shadow-lg shadow-gray-300 hover:shadow-indigo-200 flex items-center gap-2">
                        <i class="fa-solid fa-plus"></i> Buka Jasa
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero & Search Section -->
    <header class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-16 pb-12 text-center relative z-10">
        <!-- Badge kecil -->
        <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white border border-gray-200 text-xs font-semibold text-gray-600 mb-6 shadow-sm">
            <span class="flex h-2 w-2 rounded-full bg-green-500"></span>
            Platform Micro-Freelance #1 untuk Gen Z
        </div>

        <h1 class="text-4xl md:text-6xl font-extrabold mb-6 tracking-tight leading-tight">
            Temukan Jasa Kreatif <br>
            <span class="text-primary scribble-underline">Talenta Muda</span> Terbaik
            <i class="fa-solid fa-sparkles text-secondary text-3xl ml-2 animate-pulse"></i>
        </h1>
        
        <p class="text-gray-500 max-w-xl mx-auto mb-10 text-lg">Pesan jasa desain, video, coding, hingga penulisan dari pelajar & mahasiswa berbakat. Harga bersahabat, kualitas juara.</p>
        
        <!-- Search Input (Wajib dari PRD) -->
        <div class="max-w-xl mx-auto relative group">
            <div class="absolute -inset-1 bg-gradient-to-r from-primary to-secondary rounded-2xl blur opacity-25 group-hover:opacity-50 transition duration-1000 group-hover:duration-200"></div>
            <div class="relative flex items-center bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <i class="fa-solid fa-search absolute left-5 text-gray-400 text-lg"></i>
                <input type="text" id="search-input" placeholder="Cari jasa (misal: Desain Logo)..." 
                    class="w-full pl-14 pr-4 py-4 focus:outline-none text-lg bg-transparent">
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pb-20 relative z-10">
        
        <!-- Category Filters (Wajib dari PRD) -->
        <div id="category-filters" class="flex flex-wrap justify-center gap-3 mb-12">
            <button class="filter-btn px-6 py-2.5 rounded-full font-bold bg-primary text-white shadow-md shadow-indigo-200 transition-all transform hover:scale-105" data-category="Semua">Semua</button>
            <button class="filter-btn px-6 py-2.5 rounded-full font-bold bg-white text-gray-600 border border-gray-200 hover:border-primary hover:text-primary transition-all transform hover:scale-105" data-category="Design">Design</button>
            <button class="filter-btn px-6 py-2.5 rounded-full font-bold bg-white text-gray-600 border border-gray-200 hover:border-primary hover:text-primary transition-all transform hover:scale-105" data-category="Video">Video</button>
            <button class="filter-btn px-6 py-2.5 rounded-full font-bold bg-white text-gray-600 border border-gray-200 hover:border-primary hover:text-primary transition-all transform hover:scale-105" data-category="Code">Code</button>
            <button class="filter-btn px-6 py-2.5 rounded-full font-bold bg-white text-gray-600 border border-gray-200 hover:border-primary hover:text-primary transition-all transform hover:scale-105" data-category="Writing">Writing</button>
        </div>

        <!-- Grid Container -->
        <div id="gigs-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            <!-- Konten akan diisi oleh JS (app.js) -->
        </div>
    </main>

    <!-- Modal Overlay (Wajib dari PRD) -->
    <div id="modal-overlay" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div id="modal-content" class="bg-white rounded-3xl shadow-2xl w-full max-w-lg overflow-hidden transform transition-all">
            <div class="p-8 text-center text-gray-500">
                <p>Memuat data...</p>
            </div>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
</body>
