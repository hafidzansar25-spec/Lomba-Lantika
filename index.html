<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HustleYouth - Micro-Freelance Marketplace</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { brand: { 500: '#8b5cf6', 600: '#7c3aed' } }
                }
            }
        }
    </script>
</head>
<body class="antialiased">

    <!-- Navbar -->
    <nav class="glass-panel fixed w-full z-40 top-0 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <i class="fa-solid fa-bolt text-brand-500 text-2xl"></i>
            <h1 class="text-xl font-bold tracking-wide">Hustle<span class="text-brand-500">Youth</span></h1>
        </div>
        <a href="tambah-jasa.html" class="bg-gradient-to-r from-brand-600 to-purple-800 hover:from-brand-500 hover:to-purple-700 text-white px-5 py-2 rounded-full text-sm font-semibold transition-all shadow-[0_0_15px_rgba(124,58,237,0.4)]">
            <i class="fa-solid fa-plus mr-1"></i> Buka Jasa
        </a>
    </nav>

    <!-- Hero Section -->
    <header class="pt-32 pb-12 px-6 max-w-6xl mx-auto text-center">
        <h2 class="text-4xl md:text-5xl font-extrabold mb-4 leading-tight">
            Temukan <span class="text-transparent bg-clip-text bg-gradient-to-r from-purple-400 to-pink-500 glow-text">Talenta Muda</span> Terbaik
        </h2>
        <p class="text-gray-400 mb-8 max-w-2xl mx-auto">Platform micro-freelance untuk pelajar dan profesional muda. Jual keahlianmu atau temukan jasa kreatif dengan mudah.</p>
        
        <!-- Search Bar -->
        <div class="relative max-w-xl mx-auto mb-8">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
            <input type="text" id="search-input" placeholder="Cari jasa (contoh: desain poster, video edit)..." 
                class="w-full glass-panel text-white placeholder-gray-400 rounded-full py-4 pl-12 pr-4 focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all">
        </div>

        <!-- Category Filters -->
        <div id="category-filters" class="flex flex-wrap justify-center gap-3">
            <button class="filter-btn active bg-brand-600 text-white px-5 py-2 rounded-full text-sm font-medium transition-all" data-category="Semua">Semua</button>
            <button class="filter-btn glass-panel text-gray-300 hover:text-white hover:bg-white/10 px-5 py-2 rounded-full text-sm font-medium transition-all" data-category="Design">Design</button>
            <button class="filter-btn glass-panel text-gray-300 hover:text-white hover:bg-white/10 px-5 py-2 rounded-full text-sm font-medium transition-all" data-category="Video">Video</button>
            <button class="filter-btn glass-panel text-gray-300 hover:text-white hover:bg-white/10 px-5 py-2 rounded-full text-sm font-medium transition-all" data-category="Code">Code</button>
            <button class="filter-btn glass-panel text-gray-300 hover:text-white hover:bg-white/10 px-5 py-2 rounded-full text-sm font-medium transition-all" data-category="Writing">Writing</button>
        </div>
    </header>

    <!-- Main Content Grid -->
    <main class="max-w-6xl mx-auto px-6 pb-24">
        <div id="gigs-container" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Cards akan dimuat oleh JS -->
        </div>
    </main>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70 backdrop-blur-sm transition-opacity">
        <div class="glass-panel w-full max-w-lg rounded-2xl p-6 relative animate-modal">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white bg-white/5 hover:bg-white/10 w-8 h-8 rounded-full flex items-center justify-center transition-colors z-10">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div id="modal-content">
                <!-- Konten dinamis dari JS -->
            </div>
        </div>
    </div>

    <!-- Custom JS -->
    <script src="script.js"></script>
</body>
</html>
